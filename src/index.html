<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="National Park Service park page clone for WDD 231" />
    <meta name="author" content="Austin Sego" />
    <title>Yellowstone National Park</title>

    <link rel="stylesheet" href="./css/style.css" />
  </head>

  <body>
    <p class="disclaimer">
      Not an official site. Visit the official site for
      <a href="https://www.nps.gov/yell/index.htm">Yellowstone National Park</a>
    </p>

    <div class="skip-links" aria-label="short-cut links" role="navigation">
      <a class="skip-link" href="#main">Skip to main content</a>
      <a class="skip-link" href="#park-footer">Skip to footer</a>
    </div>

    <header>
      <section class="global-header">
        <div class="global-header__inner">
          <a class="global-header__brand" href="https://www.nps.gov/" aria-label="National Park Service Home">
            <span class="global-header__brand-text">National Park Service</span>
          </a>

          <div class="global-header__actions">
            <button class="icon-button" type="button" aria-label="Search">
              <svg class="icon" aria-hidden="true">
                <use xlink:href="/images/sprite.symbol.svg#search"></use>
              </svg>
              <span class="icon-button__text">Search</span>
            </button>

            <button class="icon-button" type="button" aria-label="Menu">
              <svg class="icon" aria-hidden="true">
                <use xlink:href="/images/sprite.symbol.svg#menu"></use>
              </svg>
              <span class="icon-button__text">Menu</span>
            </button>
          </div>
        </div>
      </section>

      <section id="park-header" class="park-header">
  <div class="hero-banner">
    <img
      class="hero-banner__image"
      src="https://www.nps.gov/common/uploads/structured_data/3C7D5920-1DD8-B71B-0B83F012ED802CEA.jpg"
      alt="Yellowstone National Park"
    />

    <div class="hero-banner__content">
      <div class="hero-banner__info">
        <a href="/" class="hero-banner__title">Yellowstone</a>
        <p class="hero-banner__subtitle">
          <span>National Park</span>
          <span>ID, MT, WY</span>
        </p>
      </div>
    </div>
  </div>

  <nav class="park-nav" aria-label="Park quick links">
    <a class="park-nav__item" href="#">
      <svg class="icon" aria-hidden="true">
        <use xlink:href="/images/sprite.symbol.svg#info"></use>
      </svg>
      <span class="park-nav__text">Info</span>
    </a>

    <a class="park-nav__item" href="#">
      <svg class="icon" aria-hidden="true">
        <use xlink:href="/images/sprite.symbol.svg#alert"></use>
      </svg>
      <span class="park-nav__text">Alerts</span>
    </a>

    <a class="park-nav__item" href="#">
      <svg class="icon" aria-hidden="true">
        <use xlink:href="/images/sprite.symbol.svg#location"></use>
      </svg>
      <span class="park-nav__text">Maps</span>
    </a>

    <a class="park-nav__item" href="#">
      <svg class="icon" aria-hidden="true">
        <use xlink:href="/images/sprite.symbol.svg#calendar"></use>
      </svg>
      <span class="park-nav__text">Calendar</span>
    </a>

    <a class="park-nav__item" href="#">
      <svg class="icon" aria-hidden="true">
        <use xlink:href="/images/sprite.symbol.svg#fee-22"></use>
      </svg>
      <span class="park-nav__text">Fees</span>
    </a>
  </nav>
</section>

    </header>

    <main id="main">
      <section class="intro"></section>
      <section class="info"></section>
    </main>


    <footer id="park-footer" class="park-footer">
      <!-- footer content will go here in later parts -->
    </footer>

    <script type="module" src="./js/main.js"></script>
  </body>
</html>

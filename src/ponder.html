<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Improving UX</title>
    <link rel="stylesheet" href="css/badUx.css" />
  </head>
  <body>
    <main>
      <h1>Welcome to Our Website</h1>

      <p>
        We are learning how better user experience can improve readability,
        accessibility, and the overall design of a webpage.
      </p>

      <img
        src="images/ux-good.jpg"
        alt="Example of a cleaner and more user friendly webpage design"
      />

      <section>
        <h2>Helpful Features</h2>
        <ul>
          <li>Clear headings</li>
          <li>Readable text</li>
          <li>Good contrast</li>
          <li>Responsive layout</li>
          <li>Accessible images</li>
          <li>Useful forms</li>
        </ul>
      </section>

      <form>
        <label for="name">Enter your name:</label>
        <input
            type="text"
            id="name"
            name="name"
            placeholder="Your name"
            autocomplete="name"
        />
        <button type="submit">Submit</button>
      </form>
    </main>
  </body>
</html>
